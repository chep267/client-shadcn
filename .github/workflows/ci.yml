name: CI/CD Pipeline - GitHub Pages

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]

# Cấp quyền để deploy lên GitHub Pages
permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: 'pages'
    cancel-in-progress: true

jobs:
    # --- GIAI ĐOẠN 1: CI (Lint, Typecheck, Build & Store Artifact) ---
    ci:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup pnpm
              uses: pnpm/action-setup@v5
              with:
                  version: 12

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: 'pnpm'

            - name: Install Dependencies
              run: pnpm config set ignore-scripts && pnpm install --frozen-lockfile

            - name: Linter
              run: pnpm lint

            - name: Type check
              run: npx tsc --noEmit

            - name: Build Project
              run: pnpm build

            # Lưu bản build (dist) thành artifact để job CD tái sử dụng
            - name: Upload dist artifact
              uses: actions/upload-artifact@v4
              with:
                  name: build-dist
                  path: './dist'
                  retention-days: 1 # Xóa artifact sau 1 ngày để tiết kiệm dung lượng lưu trữ

    # --- GIAI ĐOẠN 2: CD (Deploy từ Artifact có sẵn) ---
    cd:
        needs: ci
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            # Tải lại thư mục ./dist đã được build từ job CI
            - name: Download dist artifact
              uses: actions/download-artifact@v4
              with:
                  name: build-dist
                  path: './dist'

            - name: Setup Pages
              uses: actions/configure-pages@v5

            - name: Upload GitHub Pages artifact
              uses: actions/upload-pages-artifact@v4
              with:
                  path: './dist'

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
